  <script>
(function() {
    const selector = 'a[href], [data-url], button, input, .card, .cat, .game-card';

    function findElementsInShadow(root, selector, list = []) {
        if (!root) return list;
        
        root.querySelectorAll(selector).forEach(el => list.push(el));
        
        root.querySelectorAll('*').forEach(el => {
            if (el.shadowRoot) {
                findElementsInShadow(el.shadowRoot, selector, list);
            }
        });
        
        return list;
    }

    setInterval(() => {
        const allElements = findElementsInShadow(document, selector);
        allElements.forEach(el => {
            if (!el.classList.contains('focusable')) {
                el.classList.add('focusable');
            }
        });
    }, 100);

    document.addEventListener('click', function(ev) {
        const path = ev.composedPath();
        let el = null;

        for (let targetNode of path) {
            if (targetNode.nodeType === Node.ELEMENT_NODE && targetNode.matches(selector)) {
                el = targetNode;
                break;
            }
        }

        if (!el) return;

        if (el.classList.contains('game-card') || el.classList.contains('card')) {
            const internalPlayBtn = el.querySelector('.play-btn, a');
            if (internalPlayBtn && internalPlayBtn !== el) {
                ev.preventDefault();
                ev.stopPropagation();
                internalPlayBtn.click();
                return;
            }
        }

        let href = el.getAttribute('href');
        if (href && !href.startsWith('/Xbox Hub/inject?=/') && !href.startsWith('http') && !href.startsWith('#') && !href.startsWith('javascript:')) {
            ev.preventDefault();
            ev.stopPropagation();
            const cleanHref = href.startsWith('/') ? href.substring(1) : href;
            window.location.href = '/Xbox Hub/inject?=/' + cleanHref;
            return;
        }

        let dataUrl = el.getAttribute('data-url');
        if (dataUrl && !dataUrl.startsWith('/Xbox Hub/inject?=/') && !dataUrl.startsWith('http')) {
            ev.preventDefault();
            ev.stopPropagation();
            const cleanDataUrl = dataUrl.startsWith('/') ? dataUrl.substring(1) : dataUrl;
            window.location.href = '/Xbox Hub/inject?=/' + cleanDataUrl;
            return;
        }
    }, true);

    Object.defineProperty(HTMLAnchorElement.prototype, 'href', {
        get: function() {
            return this.getAttribute('href');
        },
        set: function(val) {
            if (val && !val.startsWith('/Xbox Hub/inject?=/') && !val.startsWith('http') && !val.startsWith('#') && !val.startsWith('javascript:')) {
                const cleanHref = val.startsWith('/') ? val.substring(1) : val;
                this.setAttribute('href', '/Xbox Hub/inject?=/' + cleanHref);
            } else {
                this.setAttribute('href', val);
            }
        },
        configurable: true
    });
})();
