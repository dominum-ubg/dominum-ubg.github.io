<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloxcraft UBG: Xbox Hub</title>
    <link rel="icon" type="image/png" id="favicon" href="/bloxcraft_transparent.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #081a0b;
            padding: 12px 30px;
            border-bottom: 1px solid #102e13;
            height: 60px;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .xbox-logo {
            width: 32px;
            height: 32px;
            color: #107C10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .xbox-logo svg {
            width: 100%;
            height: 100%;
            fill: #107C10;
        }

        #viewerTitle {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .clog-btn {
            width: 20px;
            height: 20px;
            fill: #ffffff;
            cursor: pointer;
            transition: transform 0.2s ease, fill 0.2s ease;
        }

        .clog-btn:hover {
            fill: #107C10;
            transform: scale(1.1);
        }

        .icon-btn {
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            cursor: pointer;
        }

        .back-btn {
            background: transparent;
            border: 3px solid transparent;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.2s ease;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .back-btn img,
        .back-btn svg {
            height: 24px;
            width: auto;
            fill: white;
        }

        .content-frame {
            flex: 1;
            width: 100%;
            height: calc(100vh - 60px);
            border: none;
            background: #000000;
        }
    </style>

</head>

            </div>
            <p id="viewerTitle">Opening...</p>

        <div class="header-right">
            <button class="icon-btn" title="Toggle Fullscreen">

            </button>

            <a href="/Xbox Hub/" class="back-btn">
                <svg class="back-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                    <path d="M73.4 297.4C60.9 309.9 60.9 330.2 73.4 342.7L233.4 502.7C245.9 515.2 266.2 515.2 278.7 502.7C291.2 490.2 291.2 469.9 278.7 457.4L173.3 352L544 352C561.7 352 576 337.7 576 320C576 302.3 561.7 288 544 288L173.3 288L278.7 182.6C291.2 170.1 291.2 149.8 278.7 137.3C266.2 124.8 245.9 124.8 233.4 137.3L73.4 297.3z"/>

        </div>
    </div>

    <iframe id="app-iframe" class="content-frame" src="about:blank"></iframe>

  
    <script src="/assets/xbox.js"></script>
    <script src="/main-injection.js"></script>
    <script src="/Xbox Hub/inject/e.js"></script>
</body>
</html>
