<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloxcraft UBG - Feedback</title>
  <link rel="stylesheet" href="/feedback/feedback.css">
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Bloxcraft UBG - Feedback</h1>
      <p>Submit your rating and thoughts on the site! This is powerd by Cloudflare Workers, We recommend doing this at home and not on Chromebooks!</p>
      <div class="rating-badge" id="avgRatingBadge">⭐ Average Rating: Loading...</div>
    </div>

    <div class="card">
      <form id="feedbackForm">
        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" id="name" placeholder="Enter your display name" required>
        </div>

        <div class="form-group">
          <label for="title">Title:</label>
          <input type="text" id="title" placeholder="Summary title" required>
        </div>

        <div class="form-group">
          <label for="description">Description:</label>
          <textarea id="description" placeholder="Write your review here..." required></textarea>
        </div>

        <div class="form-group">
          <label for="stars">Stars:</label>
          <select id="stars" required>
            <option value="5">5 - Excellent</option>
            <option value="4">4 - Very Good</option>
            <option value="3">3 - Average</option>
            <option value="2">2 - Poor</option>
            <option value="1">1 - Terrible</option>
          </select>
        </div>

        <button type="submit" id="submitBtn">Submit Feedback</button>
        <div id="statusMsg" class="status-msg"></div>
      </form>
    </div>

    <h2 style="margin-bottom: 15px; font-size: 1.3rem;">All Ratings</h2>
    <div class="reviews-list" id="reviewsList">
      <p style="color: #a0a5ba; text-align: center;">Loading reviews...</p>
    </div>
  </div>

  <script src="/feedback/feedback.js"></script>
  <script src="/main-injection.js"></script>
</body>
</html>
